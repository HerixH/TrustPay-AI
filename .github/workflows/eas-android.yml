# Manual Android builds via EAS after linking this repo on expo.dev.
#
# 1. Create EXPO_TOKEN: https://expo.dev/accounts/[account]/settings/access-tokens
# 2. GitHub repo → Settings → Secrets → Actions → New repository secret → EXPO_TOKEN
# 3. Actions → "EAS Android build" → Run workflow (pick profile)

name: EAS Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (see mobile/eas.json)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - development
          - dapp-store
          - production-apk

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (Android)
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
