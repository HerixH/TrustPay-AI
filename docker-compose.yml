services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATABASE_PATH: "/data/trustpay.sqlite"
      SOLANA_RPC_URL: "${SOLANA_RPC_URL:-https://api.devnet.solana.com}"
      TRUSTPAY_PROGRAM_ID: "${TRUSTPAY_PROGRAM_ID:-Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFDSn}"
    volumes:
      - trustpay-data:/data

volumes:
  trustpay-data:
