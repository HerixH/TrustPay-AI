# Railway: force Docker (Rust API). Root Dockerfile must be named "Dockerfile" for detection.
# Dashboard override: unset custom Start Command if it still says npm/node.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
